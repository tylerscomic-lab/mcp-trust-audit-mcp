version: 1
name: mcp-trust-audit-mcp
description: Audits MCP servers for tool-poisoning and tool-shadowing attacks. Scan a remote server by URL or paste its tool list: hidden agent-directed instructions, sensitive-path references, invisible or homoglyph Unicode in names, near-duplicate tool names.
runtime: typescript
entry: server.js
build:
  install: npm install
startCommand:
  type: http
  command: node server.js
  port: 8080
  healthCheck: /health
  mcpPath: /mcp
